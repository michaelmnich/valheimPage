<script>
  // === 1. ODLICZANIE DO 23:00 DZISIAJ ===
  const now = new Date();
  const targetDate = new Date(
    now.getFullYear(),
    now.getMonth(),
    now.getDate(),
    23, 0, 0
  ).getTime();

  function updateCountdown() {
    const currentTime = new Date().getTime();
    const difference = targetDate - currentTime;

    if (difference <= 0) {
      document.getElementById('countdown-wrapper').innerHTML = 
        "<div style='font-size: 20px; color: #2b1d0c; font-weight: bold; margin-bottom: 15px;'>SERWER JEST OTWARTY!</div>";
      return;
    }

    const hours = Math.floor(difference / (1000 * 60 * 60));
    const minutes = Math.floor((difference % (1000 * 60 * 60)) / (1000 * 60));
    const seconds = Math.floor((difference % (1000 * 60)) / 1000);

    document.getElementById("hours").innerText = String(hours).padStart(2, '0');
    document.getElementById("minutes").innerText = String(minutes).padStart(2, '0');
    document.getElementById("seconds").innerText = String(seconds).padStart(2, '0');
  }

  updateCountdown();
  setInterval(updateCountdown, 1000);

  // === 2. ODCZYT STATUSU Z STATUS.JSON ===
  async function checkValheimServer() {
    const dot = document.getElementById("status-dot");
    const text = document.getElementById("status-text");

    try {
      // Pobieranie status.json bez pamięci podręcznej (cache)
      const response = await fetch('./status.json?t=' + new Date().getTime());
      
      if (!response.ok) {
        throw new Error("Plik status.json nieodnaleziony");
      }

      const data = await response.json();

      if (data.status === "online") {
        dot.className = "status-dot online";
        text.innerText = "ONLINE";
      } else {
        dot.className = "status-dot offline";
        text.innerText = "OFFLINE";
      }
    } catch (error) {
      console.error("Błąd odczytu statusu:", error);
      dot.className = "status-dot offline";
      text.innerText = "OFFLINE"; 
    }
  }

  // Sprawdzanie statusu od razu i odświeżanie co 15 sekund
  checkValheimServer();
  setInterval(checkValheimServer, 15000);
</script>
