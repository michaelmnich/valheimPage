<!DOCTYPE html>
<html lang="pl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Odliczanie do Otwarcia Serwera</title>
  <!-- Import wikingowego / klimatycznego fontu ze Google Fonts -->
  <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@700&display=swap" rel="stylesheet">
  
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      background-color: #0b1319;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      font-family: 'Cinzel', serif, sans-serif;
    }

    /* Główny kontener z grafiką w tle */
    .banner-container {
      position: relative;
      width: 100%;
      max-width: 1200px;
      height: 675px;
      /* Podmień nazwę pliku obrazu na swój baner */
      background: url('baner_valheim.jpg') center/cover no-repeat;
      border-radius: 8px;
      box-shadow: 0 10px 30px rgba(0,0,0,0.8);
      overflow: hidden;
    }

    /* Prawa sekcja umieszczona dokładnie na pergaminie/kamieniu */
    .countdown-box {
      position: absolute;
      right: 5%;
      top: 50%;
      transform: translateY(-40%);
      width: 280px;
      text-align: center;
      padding: 20px;
      background: rgba(243, 235, 211, 0.85); /* subtelne tło w kolorze pergaminu */
      border: 3px solid #4a3520;
      border-radius: 12px;
      box-shadow: inset 0 0 15px rgba(0,0,0,0.3), 0 4px 15px rgba(0,0,0,0.5);
    }

    .countdown-title {
      font-size: 16px;
      color: #2b1d0c;
      font-weight: bold;
      text-transform: uppercase;
      margin-bottom: 15px;
      letter-spacing: 1px;
    }

    /* Kafelki odliczania */
    .timer {
      display: flex;
      justify-content: space-around;
      gap: 5px;
    }

    .time-unit {
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    .number {
      font-size: 28px;
      font-weight: bold;
      color: #1a1005;
      background: #e8dbb8;
      border: 2px solid #5c4228;
      border-radius: 6px;
      padding: 6px 10px;
      min-width: 55px;
      box-shadow: 0 2px 5px rgba(0,0,0,0.2);
    }

    .label {
      font-size: 11px;
      color: #4a3520;
      margin-top: 6px;
      text-transform: uppercase;
      font-weight: bold;
    }
  </style>
</head>
<body>

  <div class="banner-container">
    <!-- Pudełko z licznikiem -->
    <div class="countdown-box">
      <div class="countdown-title">Do otwarcia pozostało:</div>
      <div class="timer">
        <div class="time-unit">
          <span class="number" id="hours">00</span>
          <span class="label">Godz</span>
        </div>
        <div class="time-unit">
          <span class="number" id="minutes">00</span>
          <span class="label">Min</span>
        </div>
        <div class="time-unit">
          <span class="number" id="seconds">00</span>
          <span class="label">Sek</span>
        </div>
      </div>
    </div>
  </div>

  <script>
    // Ustaw datę i godzinę otwarcia serwera (Format: YYYY-MM-DDTHH:MM:SS)
    const targetDate = new Date("2026-09-10T20:00:00").getTime();

    function updateCountdown() {
      const now = new Date().getTime();
      const difference = targetDate - now;

      if (difference <= 0) {
        document.querySelector('.countdown-box').innerHTML = 
          "<div style='font-size: 22px; color: #2b1d0c; font-weight: bold;'>SERWER OTWARTY!</div>";
        return;
      }

      // Obliczanie łącznej liczby godzin (włączając dni), minut i sekund
      const hours = Math.floor(difference / (1000 * 60 * 60));
      const minutes = Math.floor((difference % (1000 * 60 * 60)) / (1000 * 60));
      const seconds = Math.floor((difference % (1000 * 60)) / 1000);

      // Wyświetlanie z zerem na początku (np. 05 zamiast 5)
      document.getElementById("hours").innerText = String(hours).padStart(2, '0');
      document.getElementById("minutes").innerText = String(minutes).padStart(2, '0');
      document.getElementById("seconds").innerText = String(seconds).padStart(2, '0');
    }

    // Odświeżanie co sekundę
    updateCountdown();
    setInterval(updateCountdown, 1000);
  </script>

</body>
</html>
