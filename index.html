<script>
  // === 1. ODLICZANIE DO 23:00 (NIE WPŁYWA NA STATUS) ===
  const now = new Date();
  const targetDate = new Date(
    now.getFullYear(),
    now.getMonth(),
    now.getDate(),
    23, 0, 0
  ).getTime();

  function updateCountdown() {
    const currentTime = new Date().getTime();
    const difference = targetDate - currentTime;

    if (difference <= 0) {
      document.getElementById('countdown-wrapper').innerHTML = 
        "<div style='font-size: 20px; color: #2b1d0c; font-weight: bold; margin-bottom: 15px;'>SERWER JEST OTWARTY!</div>";
      return;
    }

    const hours = Math.floor(difference / (1000 * 60 * 60));
    const minutes = Math.floor((difference % (1000 * 60 * 60)) / (1000 * 60));
    const seconds = Math.floor((difference % (1000 * 60)) / 1000);

    document.getElementById("hours").innerText = String(hours).padStart(2, '0');
    document.getElementById("minutes").innerText = String(minutes).padStart(2, '0');
    document.getElementById("seconds").innerText = String(seconds).padStart(2, '0');
  }

  updateCountdown();
  setInterval(updateCountdown, 1000);

  // === 2. STATUS SERWERA (NIE ZALEŻY OD CZASU ODLICZANIA) ===
  async function checkValheimServer() {
    const dot = document.getElementById("status-dot");
    const text = document.getElementById("status-text");

    try {
      // Ścieżka relatywna do status.json w tym samym katalogu
      const response = await fetch('status.json?t=' + Date.now());
      
      if (!response.ok) {
        throw new Error("HTTP error " + response.status);
      }

      const data = await response.json();

      // Działanie wyłącznie na podstawie wartości z pliku JSON
      if (data && data.status === "online") {
        dot.className = "status-dot online";
        text.innerText = "ONLINE";
      } else {
        dot.className = "status-dot offline";
        text.innerText = "OFFLINE";
      }
    } catch (error) {
      console.error("Błąd pobierania status.json:", error);
      dot.className = "status-dot offline";
      text.innerText = "OFFLINE";
    }
  }

  // Wymuszenie weryfikacji od razu po załadowaniu
  checkValheimServer();
  setInterval(checkValheimServer, 10000);
</script>
